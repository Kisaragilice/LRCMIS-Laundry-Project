map $http_x_forwarded_for $lrcmis_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $lrcmis_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Re-resolve the API container through Docker's embedded DNS. Without this,
    # Nginx can cache an old container IP after `docker compose up --build`
    # and return 502 until the web container is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://server:4000;

    # API proxy. Keep the /api prefix so Express receives /api/v1/... unchanged.
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $lrcmis_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lrcmis_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Long-lived asset caching. Security headers are repeated because nginx
    # stops inheriting server-level add_header directives once a location
    # declares its own.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Never cache the SPA entry point, so a new deployment is visible after
    # refresh instead of loading an old index.html with deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
